server:
    port: 8080
    host: "0.0.0.0"
    read_timeout: 30s
    write_timeout: 30s
    max_conns_per_ip: 100
    max_request_size: 10MB
    concurrency: 256000
    reuse_port: true
mock:
    seed: 12345
    locale: "en"
    max_depth: 5
    default_array_length: 3
    prefer_examples: false
logging:
    level: "error"
    format: json
    output: stdout
    sampling: false
    add_caller: true
chaos:
    enabled: false
    scenarios: []
plugins: []
metrics:
    enabled: true
    port: 9090
    path: /metrics
    prometheus: true
