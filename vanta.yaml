server:
    port: 8080
    host: "0.0.0.0"
    read_timeout: 30s
    write_timeout: 30s
    max_conns_per_ip: 100
    max_request_size: 10MB
    concurrency: 256000
    reuse_port: true
mock:
    seed: 12345
    locale: "en"
    max_depth: 5
    default_array_size: 3
    prefer_examples: false
logging:
    level: "info"
    format: "json"
    output: stdout
    sampling: false
    add_caller: true
middleware:
    request_id: true
hotreload:
    enabled: true
    watch_config: true
    watch_spec: true
    debounce_delay: 500ms
chaos:
    enabled: false
    scenarios: []
plugins: []
metrics:
    enabled: true
    port: 9090
    path: /metrics
    prometheus: true
