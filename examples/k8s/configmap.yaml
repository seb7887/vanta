apiVersion: v1
kind: ConfigMap
metadata:
  name: vanta-config
  labels:
    app: vanta
    component: config
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
      max_header_size: 8192

    spec_path: "/app/examples/petstore.yaml"

    hot_reload:
      enabled: false

    logging:
      level: "info"
      format: "json"
      output: "stdout"

    metrics:
      enabled: true
      path: "/metrics"

    health:
      enabled: true
      path: "/health"

    cors:
      enabled: true
      allowed_origins: ["*"]
      allowed_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
      allowed_headers: ["*"]
      exposed_headers: ["*"]
      allow_credentials: false
      max_age: 86400

    chaos:
      enabled: false

    recording:
      enabled: false

    plugins:
      enabled: true
      builtin:
        logging:
          enabled: true
          level: "info"
        cors:
          enabled: true
        rate_limit:
          enabled: false
        auth:
          enabled: false

    tui:
      enabled: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanta-spec
  labels:
    app: vanta
    component: spec
data:
  petstore.yaml: |
    openapi: 3.0.3
    info:
      title: Pet Store API
      description: A simple Pet Store API for Kubernetes deployment
      version: 1.0.0
    servers:
      - url: http://localhost:8080
        description: Development server

    paths:
      /pets:
        get:
          summary: List all pets
          operationId: listPets
          responses:
            '200':
              description: A paged array of pets
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pet'
        post:
          summary: Create a pet
          operationId: createPet
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/NewPet'
          responses:
            '201':
              description: Created pet
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Pet'

      /pets/{petId}:
        get:
          summary: Get a specific pet
          operationId: getPet
          parameters:
            - name: petId
              in: path
              required: true
              schema:
                type: integer
                format: int64
          responses:
            '200':
              description: The requested pet
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Pet'
            '404':
              description: Pet not found

      /health:
        get:
          summary: Health check endpoint
          operationId: healthCheck
          responses:
            '200':
              description: Service is healthy
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "healthy"
                      timestamp:
                        type: string
                        format: date-time

    components:
      schemas:
        Pet:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
              format: int64
              example: 1
            name:
              type: string
              example: "doggie"
            status:
              type: string
              enum: [available, pending, sold]
              example: "available"

        NewPet:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: "doggie"
            status:
              type: string
              enum: [available, pending, sold]
              example: "available"