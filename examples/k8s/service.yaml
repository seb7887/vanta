apiVersion: v1
kind: Service
metadata:
  name: vanta
  labels:
    app: vanta
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: vanta

---
# Optional: LoadBalancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: vanta-external
  labels:
    app: vanta
    service-type: external
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: vanta

---
# Optional: NodePort service for development
apiVersion: v1
kind: Service
metadata:
  name: vanta-nodeport
  labels:
    app: vanta
    service-type: nodeport
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: vanta