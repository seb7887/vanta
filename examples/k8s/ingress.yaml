apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vanta
  labels:
    app: vanta
  annotations:
    # NGINX ingress controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"

    # CORS headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # Health check
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/healthcheck-path: "/health"

    # Timeout settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"

    # Custom headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-API-Mock: vanta";
      more_set_headers "X-API-Version: v1";

spec:
  ingressClassName: nginx
  rules:
  - host: vanta.example.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vanta
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: vanta
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: vanta
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: vanta
            port:
              number: 80

---
# Optional: HTTPS ingress with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vanta-tls
  labels:
    app: vanta
    tls: enabled
  annotations:
    # NGINX ingress controller annotations for HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Certificate manager annotation (if using cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"

    # CORS headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-API-Mock: vanta";
      more_set_headers "X-API-Version: v1";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";

spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - vanta.example.com  # Replace with your actual domain
    secretName: vanta-tls-secret
  rules:
  - host: vanta.example.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vanta
            port:
              number: 80