openapi: 3.0.3
info:
  title: Pet Store API
  description: A simple Pet Store API for Docker demo
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
              examples:
                small_list:
                  summary: "Small list of pets"
                  value:
                    - id: 1
                      name: "Buddy"
                      status: "available"
                    - id: 2
                      name: "Max"
                      status: "pending"
                large_list:
                  summary: "Large list of pets"
                  value:
                    - id: 1
                      name: "Buddy"
                      status: "available"
                    - id: 2
                      name: "Max"
                      status: "pending"
                    - id: 3
                      name: "Charlie"
                      status: "sold"
                    - id: 4
                      name: "Luna"
                      status: "available"
                    - id: 5
                      name: "Rocky"
                      status: "available"
                empty_list:
                  summary: "Empty list"
                  value: []
    post:
      summary: Create a pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/{petId}:
    get:
      summary: Get a specific pet
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              examples:
                available_pet:
                  summary: "Available pet"
                  value:
                    id: 1
                    name: "Buddy"
                    status: "available"
                pending_pet:
                  summary: "Pending pet"
                  value:
                    id: 2
                    name: "Max"
                    status: "pending"
                sold_pet:
                  summary: "Sold pet"
                  value:
                    id: 3
                    name: "Charlie"
                    status: "sold"
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: integer
              examples:
                pet_not_found:
                  summary: "Pet not found"
                  value:
                    error: "NOT_FOUND"
                    message: "Pet with the specified ID was not found"
                    code: 404
                invalid_pet_id:
                  summary: "Invalid pet ID format"
                  value:
                    error: "INVALID_ID"
                    message: "Pet ID must be a positive integer"
                    code: 404

  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "doggie"
        status:
          type: string
          enum: [available, pending, sold]
          example: "available"

    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          #example: "doggie"
        status:
          type: string
          enum: [available, pending, sold]
          #example: "available"