name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25', '1.24']
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -race -coverprofile=coverage.out ./...

    - name: Upload coverage (Ubuntu + Latest Go only)
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build for current platform
      run: go build -v ./main.go

    - name: Build for all platforms (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        GOOS=linux GOARCH=amd64 go build -o build/vanta-linux-amd64 ./main.go
        GOOS=linux GOARCH=arm64 go build -o build/vanta-linux-arm64 ./main.go
        GOOS=darwin GOARCH=amd64 go build -o build/vanta-darwin-amd64 ./main.go
        GOOS=darwin GOARCH=arm64 go build -o build/vanta-darwin-arm64 ./main.go
        GOOS=windows GOARCH=amd64 go build -o build/vanta-windows-amd64.exe ./main.go

    - name: Upload build artifacts (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: build/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Gosec Security Scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: './...'

    - name: Run Nancy vulnerability scanner
      uses: sonatypecommunity/nancy-github-action@main
      continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: build/

    - name: Make binary executable
      run: chmod +x build/vanta-linux-amd64

    - name: Start vanta server
      run: |
        ./build/vanta-linux-amd64 start --config examples/docker-config.yaml --spec examples/petstore.yaml &
        echo $! > vanta.pid

    - name: Wait for server to start
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:8080/health 2>/dev/null; then
            echo "Server is ready"
            break
          fi
          echo "Waiting for server... ($i/30)"
          sleep 2
        done

    - name: Run API tests
      run: |
        # Test health endpoint
        curl -f -v http://localhost:8080/health

        # Test pets endpoints
        curl -f -v http://localhost:8080/pets
        curl -f -v -X POST -H "Content-Type: application/json" -d '{"name":"test","status":"available"}' http://localhost:8080/pets
        curl -f -v http://localhost:8080/pets/1

        # Test metrics endpoint
        curl -f -v http://localhost:8080/metrics

        echo "All API tests passed!"

    - name: Test TUI mode (headless)
      run: |
        # Kill the previous instance
        kill $(cat vanta.pid) && rm vanta.pid
        sleep 2

        # Test TUI in readonly mode (should exit quickly)
        timeout 5s ./build/vanta-linux-amd64 tui --readonly --config examples/tui-config.yaml || true

    - name: Test CLI commands
      run: |
        # Test version command
        ./build/vanta-linux-amd64 version

        # Test config validation
        ./build/vanta-linux-amd64 config validate examples/docker-config.yaml

        # Test chaos commands (should not error even if not running)
        ./build/vanta-linux-amd64 chaos list --config examples/chaos-config.yaml || true

    - name: Cleanup
      if: always()
      run: |
        if [ -f vanta.pid ]; then
          kill $(cat vanta.pid) 2>/dev/null || true
          rm vanta.pid
        fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: |
          vanta:latest
          vanta:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Test Docker image
      run: |
        # Load and test the amd64 image
        docker buildx build --platform linux/amd64 --load -t vanta:test .

        # Start container
        docker run -d --name vanta-test -p 8080:8080 vanta:test

        # Wait for container to be ready
        for i in {1..30}; do
          if curl -f http://localhost:8080/health 2>/dev/null; then
            echo "Container is ready"
            break
          fi
          echo "Waiting for container... ($i/30)"
          sleep 2
        done

        # Test API
        curl -f http://localhost:8080/health
        curl -f http://localhost:8080/pets

        # Check container logs
        docker logs vanta-test

        # Cleanup
        docker stop vanta-test
        docker rm vanta-test

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run benchmarks
      run: |
        go test -bench=. -benchmem -benchtime=10s ./test/benchmarks/... > benchmark.txt
        cat benchmark.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks
        path: benchmark.txt

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [test, lint, build, security, integration, docker]
    if: failure() && github.event_name == 'push'
    steps:
    - name: Notify on failure (Optional)
      if: vars.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: |
          ❌ CI failed for ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
      env:
        SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}