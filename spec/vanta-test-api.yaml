openapi: 3.0.3
info:
  title: Vanta Test API - Comprehensive Testing Specification
  description: |
    Una especificación OpenAPI comprehensiva diseñada específicamente para testear
    todas las funcionalidades de Vanta CLI. Incluye diversos tipos de datos,
    operaciones CRUD, autenticación, validaciones, webhooks y casos edge.
  version: 1.0.0
  contact:
    name: Vanta Testing Team
    email: test@vanta.dev
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.vanta-test.dev
    description: Testing server

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  # ===== HEALTH & SYSTEM ENDPOINTS =====
  /health:
    get:
      summary: Health check endpoint
      description: Endpoint básico para verificar estado del servidor
      operationId: healthCheck
      tags: [System]
      security: []
      responses:
        '200':
          description: Servidor saludable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                timestamp: "2025-01-15T10:30:00Z"
                uptime: 3600
                version: "1.0.0"

  /metrics:
    get:
      summary: Server metrics
      description: Métricas del servidor para testing de TUI y monitoring
      operationId: getMetrics
      tags: [System]
      responses:
        '200':
          description: Métricas del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  # ===== USER MANAGEMENT =====
  /users:
    get:
      summary: List users
      description: Obtener lista de usuarios con paginación y filtros
      operationId: listUsers
      tags: [Users]
      parameters:
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Elementos por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          description: Filtrar por rol
          schema:
            type: string
            enum: [admin, user, moderator]
        - name: active
          in: query
          description: Filtrar por estado activo
          schema:
            type: boolean
        - name: created_after
          in: query
          description: Filtrar usuarios creados después de esta fecha
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          headers:
            X-Total-Count:
              description: Total de usuarios
              schema:
                type: integer
            X-Page:
              description: Página actual
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
              example:
                users:
                  - id: 1
                    username: "admin"
                    email: "admin@example.com"
                    role: "admin"
                    active: true
                    created_at: "2025-01-01T00:00:00Z"
                  - id: 2
                    username: "testuser"
                    email: "test@example.com"
                    role: "user"
                    active: true
                    created_at: "2025-01-02T10:00:00Z"
                pagination:
                  page: 1
                  limit: 20
                  total: 2
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create user
      description: Crear un nuevo usuario
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              username: "newuser"
              email: "newuser@example.com"
              password: "SecurePass123!"
              role: "user"
              profile:
                first_name: "John"
                last_name: "Doe"
                phone: "+1234567890"
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CONFLICT"
                message: "User with this email already exists"
                code: 409

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: ID del usuario
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      summary: Get user by ID
      description: Obtener información detallada de un usuario
      operationId: getUserById
      tags: [Users]
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update user
      description: Actualizar información de usuario completa
      operationId: updateUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Partially update user
      description: Actualización parcial de usuario
      operationId: patchUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Usuario actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete user
      description: Eliminar usuario (soft delete)
      operationId: deleteUser
      tags: [Users]
      responses:
        '204':
          description: Usuario eliminado exitosamente
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No se puede eliminar usuario activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== PRODUCT MANAGEMENT =====
  /products:
    get:
      summary: List products
      description: Obtener catálogo de productos con búsqueda y filtros
      operationId: listProducts
      tags: [Products]
      security: []
      parameters:
        - name: search
          in: query
          description: Búsqueda por nombre o descripción
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: category
          in: query
          description: Filtrar por categoría
          schema:
            type: string
            enum: [electronics, clothing, books, home, sports]
        - name: min_price
          in: query
          description: Precio mínimo
          schema:
            type: number
            format: float
            minimum: 0
        - name: max_price
          in: query
          description: Precio máximo
          schema:
            type: number
            format: float
            minimum: 0
        - name: in_stock
          in: query
          description: Solo productos en stock
          schema:
            type: boolean
        - name: sort
          in: query
          description: Ordenamiento
          schema:
            type: string
            enum: [name_asc, name_desc, price_asc, price_desc, created_asc, created_desc]
            default: created_desc
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  filters_applied:
                    type: object
                    properties:
                      search:
                        type: string
                      category:
                        type: string
                      price_range:
                        type: object
                        properties:
                          min:
                            type: number
                          max:
                            type: number

    post:
      summary: Create product
      description: Crear nuevo producto
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
          multipart/form-data:
            schema:
              type: object
              properties:
                product_data:
                  $ref: '#/components/schemas/ProductCreate'
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Z]{2}\d{6}$'
        example: "PR123456"
    get:
      summary: Get product details
      description: Obtener detalles completos del producto
      operationId: getProduct
      tags: [Products]
      security: []
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailed'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProductDetailed'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== ORDER MANAGEMENT =====
  /orders:
    get:
      summary: List orders
      description: Obtener lista de órdenes del usuario
      operationId: listOrders
      tags: [Orders]
      parameters:
        - name: status
          in: query
          description: Filtrar por estado
          schema:
            type: array
            items:
              type: string
              enum: [pending, processing, shipped, delivered, cancelled]
          style: form
          explode: false
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de órdenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      summary: Create order
      description: Crear nueva orden
      operationId: createOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Datos de orden inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get order details
      operationId: getOrder
      tags: [Orders]
      responses:
        '200':
          description: Detalles de la orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailed'

  /orders/{orderId}/cancel:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Cancel order
      description: Cancelar una orden existente
      operationId: cancelOrder
      tags: [Orders]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
                refund_requested:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Orden cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: No se puede cancelar la orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== ANALYTICS & REPORTING =====
  /analytics/dashboard:
    get:
      summary: Get dashboard analytics
      description: Datos para dashboard de analytics
      operationId: getDashboardAnalytics
      tags: [Analytics]
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [today, week, month, quarter, year]
        - name: timezone
          in: query
          schema:
            type: string
            pattern: '^[A-Za-z_]+/[A-Za-z_]+$'
            default: "UTC"
            example: "America/New_York"
      responses:
        '200':
          description: Datos de analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalytics'

  # ===== FILE UPLOAD/DOWNLOAD =====
  /files/upload:
    post:
      summary: Upload file
      description: Subir archivo al servidor
      operationId: uploadFile
      tags: [Files]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
                  maxLength: 200
                tags:
                  type: array
                  items:
                    type: string
                  maxItems: 5
              required:
                - file
      responses:
        '201':
          description: Archivo subido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '413':
          description: Archivo muy grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/{fileId}/download:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Download file
      description: Descargar archivo por ID
      operationId: downloadFile
      tags: [Files]
      responses:
        '200':
          description: Archivo encontrado
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== WEBHOOKS =====
  /webhooks:
    get:
      summary: List webhooks
      operationId: listWebhooks
      tags: [Webhooks]
      responses:
        '200':
          description: Lista de webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'

    post:
      summary: Create webhook
      operationId: createWebhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Webhook creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

  # ===== TESTING ENDPOINTS =====
  /test/slow:
    get:
      summary: Slow endpoint for latency testing
      description: Endpoint que responde lentamente para testear chaos latency
      operationId: slowEndpoint
      tags: [Testing]
      security: []
      parameters:
        - name: delay
          in: query
          description: Delay en milisegundos
          schema:
            type: integer
            minimum: 100
            maximum: 10000
            default: 2000
      responses:
        '200':
          description: Respuesta lenta
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  delay_applied:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time

  /test/error/{errorCode}:
    parameters:
      - name: errorCode
        in: path
        required: true
        description: Código de error HTTP a simular
        schema:
          type: integer
          enum: [400, 401, 403, 404, 429, 500, 502, 503]
    get:
      summary: Simulate HTTP errors
      description: Endpoint para testear manejo de errores
      operationId: simulateError
      tags: [Testing]
      security: []
      responses:
        '400':
          description: Bad Request simulado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden simulado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Bad Gateway simulado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /test/validation:
    post:
      summary: Test request validation
      description: Endpoint para testear validación de request body
      operationId: testValidation
      tags: [Testing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationTestRequest'
      responses:
        '200':
          description: Validación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  validated_data:
                    $ref: '#/components/schemas/ValidationTestRequest'
        '400':
          description: Errores de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    # ===== BASIC SCHEMAS =====
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código de error
        message:
          type: string
          description: Mensaje descriptivo del error
        code:
          type: integer
          description: Código HTTP
        details:
          type: object
          description: Detalles adicionales del error
        timestamp:
          type: string
          format: date-time

    ValidationError:
      type: object
      required:
        - error
        - message
        - validation_errors
      properties:
        error:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Request validation failed"
        code:
          type: integer
          example: 400
        validation_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
              value:
                type: string

    PaginationInfo:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_prev:
          type: boolean

    # ===== SYSTEM SCHEMAS =====
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: integer
          description: Uptime en segundos
        version:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, error]
            redis:
              type: string
              enum: [ok, error]
            external_api:
              type: string
              enum: [ok, error]

    MetricsResponse:
      type: object
      properties:
        requests_total:
          type: integer
          description: Total de requests procesados
        requests_per_second:
          type: number
          format: float
          description: RPS actual
        errors_total:
          type: integer
          description: Total de errores
        error_rate:
          type: number
          format: float
          description: Tasa de error
        average_latency_ms:
          type: number
          format: float
          description: Latencia promedio en ms
        p95_latency_ms:
          type: number
          format: float
          description: Latencia p95 en ms
        memory_usage_mb:
          type: number
          format: float
          description: Uso de memoria en MB
        cpu_usage_percent:
          type: number
          format: float
          description: Uso de CPU en porcentaje
        active_connections:
          type: integer
          description: Conexiones activas

    # ===== USER SCHEMAS =====
    UserProfile:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
        address:
          $ref: '#/components/schemas/Address'
        preferences:
          type: object
          properties:
            newsletter:
              type: boolean
            notifications:
              type: boolean
            theme:
              type: string
              enum: [light, dark, auto]

    Address:
      type: object
      properties:
        street:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 50
        state:
          type: string
          maxLength: 50
        postal_code:
          type: string
          pattern: '^\d{5}(-\d{4})?$'
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          example: "US"

    User:
      type: object
      required:
        - id
        - username
        - email
        - role
        - active
        - created_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, moderator]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true

    UserDetailed:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            profile:
              $ref: '#/components/schemas/UserProfile'
            stats:
              type: object
              properties:
                orders_count:
                  type: integer
                total_spent:
                  type: number
                  format: float
                favorite_category:
                  type: string

    UserCreate:
      type: object
      required:
        - username
        - email
        - password
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]'
        role:
          type: string
          enum: [admin, user, moderator]
          default: user
        profile:
          $ref: '#/components/schemas/UserProfile'

    UserUpdate:
      type: object
      required:
        - username
        - email
        - role
        - active
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, moderator]
        active:
          type: boolean
        profile:
          $ref: '#/components/schemas/UserProfile'

    UserPatch:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, moderator]
        active:
          type: boolean
        profile:
          $ref: '#/components/schemas/UserProfile'

    # ===== PRODUCT SCHEMAS =====
    Product:
      type: object
      required:
        - id
        - name
        - price
        - category
        - in_stock
        - created_at
      properties:
        id:
          type: string
          pattern: '^[A-Z]{2}\d{6}$'
          example: "PR123456"
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: number
          format: float
          minimum: 0
          multipleOf: 0.01
        category:
          type: string
          enum: [electronics, clothing, books, home, sports]
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        in_stock:
          type: boolean
        stock_quantity:
          type: integer
          minimum: 0
        images:
          type: array
          items:
            type: string
            format: uri
          maxItems: 5
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
        reviews_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ProductDetailed:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            specifications:
              type: object
              additionalProperties: true
            variants:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  price:
                    type: number
                    format: float
                  attributes:
                    type: object
            related_products:
              type: array
              items:
                type: string
              maxItems: 5

    ProductCreate:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: number
          format: float
          minimum: 0
          multipleOf: 0.01
        category:
          type: string
          enum: [electronics, clothing, books, home, sports]
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        stock_quantity:
          type: integer
          minimum: 0
          default: 0
        specifications:
          type: object
          additionalProperties: true

    # ===== ORDER SCHEMAS =====
    OrderItem:
      type: object
      required:
        - product_id
        - quantity
        - unit_price
      properties:
        product_id:
          type: string
          pattern: '^[A-Z]{2}\d{6}$'
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        unit_price:
          type: number
          format: float
          minimum: 0
        total_price:
          type: number
          format: float
          readOnly: true

    Order:
      type: object
      required:
        - id
        - user_id
        - status
        - items
        - total
        - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
        subtotal:
          type: number
          format: float
          readOnly: true
        tax:
          type: number
          format: float
          readOnly: true
        shipping:
          type: number
          format: float
          readOnly: true
        total:
          type: number
          format: float
          readOnly: true
        shipping_address:
          $ref: '#/components/schemas/Address'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    OrderDetailed:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            tracking_number:
              type: string
              nullable: true
            estimated_delivery:
              type: string
              format: date
              nullable: true
            history:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  note:
                    type: string

    OrderCreate:
      type: object
      required:
        - items
        - shipping_address
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
                pattern: '^[A-Z]{2}\d{6}$'
              quantity:
                type: integer
                minimum: 1
                maximum: 100
          minItems: 1
        shipping_address:
          $ref: '#/components/schemas/Address'
        notes:
          type: string
          maxLength: 500

    # ===== ANALYTICS SCHEMAS =====
    DashboardAnalytics:
      type: object
      properties:
        period:
          type: string
          enum: [today, week, month, quarter, year]
        summary:
          type: object
          properties:
            total_revenue:
              type: number
              format: float
            total_orders:
              type: integer
            new_users:
              type: integer
            conversion_rate:
              type: number
              format: float
        charts:
          type: object
          properties:
            revenue_over_time:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  revenue:
                    type: number
                    format: float
            top_products:
              type: array
              items:
                type: object
                properties:
                  product_id:
                    type: string
                  name:
                    type: string
                  sales:
                    type: integer

    # ===== FILE SCHEMAS =====
    FileUploadResponse:
      type: object
      required:
        - id
        - filename
        - size
        - content_type
        - url
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
          description: Tamaño en bytes
        content_type:
          type: string
        url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        uploaded_at:
          type: string
          format: date-time

    # ===== WEBHOOK SCHEMAS =====
    Webhook:
      type: object
      required:
        - id
        - url
        - events
        - active
        - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [user.created, user.updated, order.created, order.updated, product.created]
        secret:
          type: string
          writeOnly: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_triggered:
          type: string
          format: date-time
          nullable: true

    WebhookCreate:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [user.created, user.updated, order.created, order.updated, product.created]
          minItems: 1
        secret:
          type: string
          minLength: 10
        active:
          type: boolean
          default: true

    # ===== TESTING SCHEMAS =====
    ValidationTestRequest:
      type: object
      required:
        - name
        - email
        - age
        - preferences
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z\s]+$'
        email:
          type: string
          format: email
        age:
          type: integer
          minimum: 18
          maximum: 120
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          nullable: true
        preferences:
          type: object
          required:
            - newsletter
          properties:
            newsletter:
              type: boolean
            notifications:
              type: boolean
            theme:
              type: string
              enum: [light, dark, auto]
              default: auto
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 20
          minItems: 1
          maxItems: 5
          uniqueItems: true
        metadata:
          type: object
          additionalProperties:
            type: string
          maxProperties: 10

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "BAD_REQUEST"
            message: "Invalid request parameters"
            code: 400

    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "UNAUTHORIZED"
            message: "Authentication required"
            code: 401

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "NOT_FOUND"
            message: "Resource not found"
            code: 404

    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "INTERNAL_SERVER_ERROR"
            message: "An unexpected error occurred"
            code: 500

  parameters:
    PageParam:
      name: page
      in: query
      description: Número de página
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

tags:
  - name: System
    description: Endpoints del sistema y health checks
  - name: Users
    description: Gestión de usuarios
  - name: Products
    description: Gestión de productos y catálogo
  - name: Orders
    description: Gestión de órdenes y compras
  - name: Analytics
    description: Analytics y reportes
  - name: Files
    description: Gestión de archivos
  - name: Webhooks
    description: Configuración de webhooks
  - name: Testing
    description: Endpoints específicos para testing

webhooks:
  userCreated:
    post:
      summary: User Created Webhook
      description: Se dispara cuando se crea un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: "user.created"
                timestamp:
                  type: string
                  format: date-time
                data:
                  $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Webhook procesado exitosamente

  orderCreated:
    post:
      summary: Order Created Webhook
      description: Se dispara cuando se crea una nueva orden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: "order.created"
                timestamp:
                  type: string
                  format: date-time
                data:
                  $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Webhook procesado exitosamente